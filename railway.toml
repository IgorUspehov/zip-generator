[build]
# Build react_mvp dist in-container so Netlify deploy can resolve artifacts/factory_output/react_mvp/dist.
buildCommand = "npm run build:railway:deploy"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/api/client-questionnaire"
healthcheckTimeout = 120

